# DigitalOcean App Platform: doctl apps create --spec .do/app.yaml
name: legends-of-taichi
region: fra
services:
  - name: web
    github:
      repo: paveler/legendsoftaichi
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm run build
    run_command: npm start
    http_port: 3000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: DIRECTUAL_REGISTER_WEBHOOK
        scope: RUN_TIME
        value: https://api.directual.com/good/api/v5/webHook/reg_legends2?appID=1a462cc7-731f-4d24-856c-2d89c53430dc
